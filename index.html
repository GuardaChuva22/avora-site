  <h1>Avora</h1>
  <p>O Avora é um assistente pessoal de uso próprio. Ele roda no servidor do seu dono e ajuda com e-mails, documentos, agenda e tarefas, sempre em nome dessa única pessoa.</p>
  <p>Não é um serviço aberto ao público: não há cadastro, venda nem outros usuários.</p>
